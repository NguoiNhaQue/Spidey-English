<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nối Từ với Hình - Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: white;
    overflow-x: hidden;
  }
  h1 { margin-bottom: 5px; font-size: 22px; }
  .subtitle { opacity: 0.7; margin-bottom: 15px; font-size: 14px; text-align: center; }
  .score { font-size: 18px; margin-bottom: 15px; color: #FFD700; }
  .board {
    display: flex;
    gap: 20px;
    max-width: 600px;
    width: 100%;
    margin-bottom: 20px;
    justify-content: center;
  }
  .column {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    max-width: 220px;
  }
  .column-title {
    text-align: center;
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .card {
    aspect-ratio: 1.4;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
    border: 3px solid transparent;
    overflow: hidden;
    position: relative;
  }
  .card.pic {
    background-size: cover;
    background-position: center;
  }
  .card.word {
    background: #ffffff20;
    color: white;
    text-align: center;
    padding: 10px;
  }
  .card:hover { transform: scale(1.05); }
  .card.selected {
    border-color: #FFD700;
    box-shadow: 0 0 15px #FFD700;
    transform: scale(1.05);
  }
  .card.matched {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
  }
  .card.wrong {
    animation: shake 0.4s;
    border-color: #ff4444;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .card.correct-flash {
    border-color: #4CAF50;
    box-shadow: 0 0 20px #4CAF50;
  }
  #message {
    font-size: 20px;
    min-height: 30px;
    margin-bottom: 15px;
    color: #4CAF50;
    font-weight: bold;
  }
  .btn {
    padding: 12px 30px;
    border: none;
    border-radius: 25px;
    background: #4CAF50;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  .btn:hover { background: #45a049; }
  .star {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    z-index: 1000;
    transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
</style>
</head>
<body>
  <h1>🧩 Nối Từ với Hình</h1>
  <div class="subtitle">Bấm 1 thẻ hình bên trái, rồi bấm 1 thẻ chữ bên phải</div>
  <div class="score">⭐ <span id="score">0</span> / <span id="total">0</span></div>
  <div id="message"></div>
  <div class="board">
    <div class="column">
      <div class="column-title">🖼️ Hình</div>
      <div id="picCol" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
    <div class="column">
      <div class="column-title">📝 Chữ</div>
      <div id="wordCol" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>
  <button class="btn" onclick="restart()">🔄 Chơi lại</button>

<script>
  const BASE = 'https://spidey-english-88.vercel.app/';
  const vocab = [
    ["morning", "buổi sáng", BASE + "assets/a14.jpg"],
    ["sun", "mặt trời", BASE + "assets/a15.jpg"],
    ["bed", "giường", BASE + "assets/a16.jpg"],
    ["wake up", "thức dậy", BASE + "assets/a11.jpg"],
    ["brush", "chải", BASE + "assets/a12.jpg"],
    ["teeth", "răng", BASE + "assets/a13.jpg"],
  ];

  let selectedPic = null;
  let selectedWord = null;
  let matched = 0;
  let lock = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function speak(text) {
    const audio = new Audio(BASE + 'assets/v_' + text.replace(/ /g, '_') + '.mp3');
    audio.onerror = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    };
    audio.play().catch(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    });
  }

  function build() {
    const picCol = document.getElementById('picCol');
    const wordCol = document.getElementById('wordCol');
    picCol.innerHTML = '';
    wordCol.innerHTML = '';
    matched = 0;
    selectedPic = null;
    selectedWord = null;
    lock = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('total').textContent = vocab.length;
    document.getElementById('message').textContent = '';

    // Shuffle pics and words SEPARATELY (not mixed)
    const pics = shuffle([...vocab]);
    const words = shuffle([...vocab]);

    pics.forEach((v) => {
      const div = document.createElement('div');
      div.className = 'card pic';
      div.dataset.word = v[0];
      div.style.backgroundImage = `url('${v[2]}')`;
      div.onclick = () => onCardClick(div, 'pic');
      picCol.appendChild(div);
    });

    words.forEach((v) => {
      const div = document.createElement('div');
      div.className = 'card word';
      div.dataset.word = v[0];
      div.textContent = v[0];
      div.onclick = () => onCardClick(div, 'word');
      wordCol.appendChild(div);
    });

    console.log(`Built: ${pics.length} pics, ${words.length} words`);
  }

  function onCardClick(div, type) {
    if (lock || div.classList.contains('matched')) return;

    if (type === 'pic') {
      if (selectedPic) selectedPic.classList.remove('selected');
      selectedPic = div;
      div.classList.add('selected');
    } else {
      if (selectedWord) selectedWord.classList.remove('selected');
      selectedWord = div;
      div.classList.add('selected');
    }

    if (selectedPic && selectedWord) {
      lock = true;
      if (selectedPic.dataset.word === selectedWord.dataset.word) {
        const word = selectedPic.dataset.word;
        const picEl = selectedPic;
        const wordEl = selectedWord;
        picEl.classList.add('correct-flash');
        wordEl.classList.add('correct-flash');
        // Star effect: from word card to pic card
        flyStar(wordEl, picEl);
        setTimeout(() => {
          picEl.classList.add('matched');
          wordEl.classList.add('matched');
          picEl.classList.remove('selected', 'correct-flash');
          wordEl.classList.remove('selected', 'correct-flash');
          selectedPic = null;
          selectedWord = null;
          lock = false;
          matched++;
          document.getElementById('score').textContent = matched;
          speak(word);
          if (matched === vocab.length) {
            document.getElementById('message').textContent = '🎉 Tuyệt vời! Xong hết rồi!';
          }
        }, 900);
      } else {
        selectedPic.classList.add('wrong');
        selectedWord.classList.add('wrong');
        setTimeout(() => {
          selectedPic.classList.remove('selected', 'wrong');
          selectedWord.classList.remove('selected', 'wrong');
          selectedPic = null;
          selectedWord = null;
          lock = false;
        }, 500);
      }
    }
  }

  function flyStar(fromEl, toEl) {
    const from = fromEl.getBoundingClientRect();
    const to = toEl.getBoundingClientRect();
    // Create 5 stars
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = '⭐';
        star.style.left = (from.left + from.width/2 - 14 + (Math.random()*40-20)) + 'px';
        star.style.top = (from.top + from.height/2 - 14) + 'px';
        document.body.appendChild(star);
        // Animate to target
        requestAnimationFrame(() => {
          star.style.left = (to.left + to.width/2 - 14 + (Math.random()*30-15)) + 'px';
          star.style.top = (to.top + to.height/2 - 14) + 'px';
          star.style.transform = 'scale(0.3) rotate(360deg)';
          star.style.opacity = '0.3';
        });
        setTimeout(() => star.remove(), 900);
      }, i * 120);
    }
  }

  function restart() { build(); }
  build();
</script>
</body>
</html>
