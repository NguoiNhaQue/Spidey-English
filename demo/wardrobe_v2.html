<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tủ đồ V2 - Nhân vật mới</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#87ceeb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h2{color:#1c2b4a;margin:8px 0 12px;text-align:center}
  .stage{position:relative;width:min(92vw,380px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;
    background:url('https://spidey-english-88.vercel.app/assets/bedroom_bg.jpg') center/cover;
    box-shadow:0 12px 32px rgba(0,0,0,.25);border:4px solid #fff}
  .hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .hero img{height:94%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
  .item{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
  .btn{padding:10px 14px;border-radius:999px;border:2px solid #bcd6f5;background:#fff;font-weight:700;cursor:pointer;font-size:13px}
  .btn.on{background:#ffd93b;border-color:#e09b00}
  .note{margin-top:12px;color:#3a4a6a;font-size:13px;text-align:center;max-width:400px;line-height:1.5}
</style>
</head>
<body>
<h2>🦸 Tủ đồ V2 — Nhân vật mới</h2>
<div class="stage" id="stage">
  <div class="hero"><img src="https://spidey-english-88.vercel.app/assets/hero_kid_front.png" alt="Hero"></div>
</div>
<div class="controls" id="controls"></div>
<p class="note">Nhân vật đứng thẳng chính diện. Bấm nút để mặc/tháo từng món.</p>
<script>
const B='https://spidey-english-88.vercel.app/assets/';
const ITEMS=[
  {id:'shoeR', name:'👟 Giày P', img:B+'final_shoe.png', l:33.1, t:91, w:18, z:3},
  {id:'shoeL', name:'👟 Giày T', img:B+'final_shoe.png', l:65.9, t:91, w:18, z:3, flip:true},
  {id:'gloveR', name:'🧤 Găng P', img:B+'final_glove.png', l:28, t:62, w:14, z:3},
  {id:'gloveL', name:'🧤 Găng T', img:B+'final_glove.png', l:72, t:62, w:14, z:3},
  {id:'glasses', name:'🕶️ Kính', img:B+'fit_glasses_v2.png', l:50, t:34, w:32, z:4},
  {id:'cape', name:'🦸 Choàng', img:B+'final_cape.png', l:50, t:68, w:48, z:1},
  {id:'sword', name:'🗡️ Kiếm', img:B+'fit_sword_v2.png', l:28, t:52, w:14, z:4},
  {id:'hat', name:'🎩 Mũ', img:B+'final_hat.png', l:50, t:8, w:16, z:5},
];
const stage=document.getElementById('stage');
const controls=document.getElementById('controls');
const active={};
ITEMS.forEach(it=>active[it.id]=true);
function render(){
  stage.querySelectorAll('.item').forEach(e=>e.remove());
  ITEMS.forEach(it=>{
    if(!active[it.id])return;
    const im=document.createElement('img');
    im.className='item'; im.src=it.img;
    let tf='translate(-50%,-50%)';
    if(it.flip)tf+=' scaleX(-1)';
    im.style.cssText=`left:${it.l}%;top:${it.t}%;width:${it.w}%;z-index:${it.z};transform:${tf};`;
    stage.appendChild(im);
  });
  controls.innerHTML='';
  // Group buttons: combine L/R pairs
  const groups=[
    {ids:['shoeR','shoeL'], name:'👟 Giày'},
    {ids:['gloveR','gloveL'], name:'🧤 Găng tay'},
    {ids:['glasses'], name:'🕶️ Kính'},
    {ids:['cape'], name:'🦸 Áo choàng'},
    {ids:['sword'], name:'🗡️ Kiếm'},
    {ids:['hat'], name:'🎩 Mũ'},
  ];
  groups.forEach(g=>{
    const isOn=g.ids.every(id=>active[id]);
    const b=document.createElement('button');
    b.className='btn'+(isOn?' on':'');
    b.textContent=g.name;
    b.onclick=()=>{
      const newVal=!isOn;
      g.ids.forEach(id=>active[id]=newVal);
      render();
    };
    controls.appendChild(b);
  });
}
render();
</script>
</body>
</html>
