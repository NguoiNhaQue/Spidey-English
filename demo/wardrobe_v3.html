<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tủ Đồ 3D - Tháo/Gắn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: white;
  }
  h1 { margin-bottom: 10px; font-size: 24px; }
  .subtitle { opacity: 0.7; margin-bottom: 20px; font-size: 14px; }
  .stage {
    position: relative;
    width: min(400px, 90vw);
    aspect-ratio: 1013 / 2155;
    margin-bottom: 20px;
  }
  .layer {
    position: absolute;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .layer.hidden { opacity: 0; }
  #base { width: 100%; height: 100%; left: 0; top: 0; z-index: 10; }
  #cape { z-index: 5; width: 110%; left: -5%; top: 42%; }
  #shoeL, #shoeR { z-index: 20; width: 24%; bottom: 1%; }
  #shoeL { left: 23%; }
  #shoeR { left: 53%; }
  #gloveL, #gloveR { z-index: 20; width: 16%; top: 60%; }
  #gloveL { left: 10%; }
  #gloveR { left: 74%; }
  #glasses { z-index: 30; width: 42%; left: 29%; top: 27.5%; }
  #sword { z-index: 25; height: 42%; left: 8%; top: 28%; }
  #hat { z-index: 30; width: 28%; left: 42%; top: 0%; transform: rotate(12deg); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 500px;
  }
  .btn {
    padding: 12px 20px;
    border: 2px solid #fff3;
    border-radius: 25px;
    background: #ffffff15;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #ffffff25; }
  .btn.active {
    background: #4CAF50;
    border-color: #4CAF50;
  }
  .btn .icon { margin-right: 6px; }
</style>
</head>
<body>
  <h1>🎮 Tủ Đồ 3D</h1>
  <div class="subtitle">Bấm nút để tháo / gắn từng món</div>
  
  <div class="stage">
    <img id="cape" class="layer hidden" src="assets3d/item_cape.png" alt="cape">
    <img id="base" class="layer" src="assets3d/hero_base.png" alt="hero">
    <img id="shoeL" class="layer hidden" src="assets3d/item_shoes.png" alt="shoeL">
    <img id="shoeR" class="layer hidden" src="assets3d/item_shoes.png" alt="shoeR">
    <img id="gloveL" class="layer hidden" src="assets3d/item_glove_l.png" alt="gloveL">
    <img id="gloveR" class="layer hidden" src="assets3d/item_glove_r.png" alt="gloveR">
    <img id="glasses" class="layer hidden" src="assets3d/item_glasses.png" alt="glasses">
    <img id="sword" class="layer hidden" src="assets3d/item_sword.png" alt="sword">
    <img id="hat" class="layer hidden" src="assets3d/item_hat.png" alt="hat">
  </div>
  
  <div class="controls">
    <button class="btn" data-item="shoeL,shoeR"><span class="icon">👟</span>Giày</button>
    <button class="btn" data-item="gloveL,gloveR"><span class="icon">🧤</span>Găng</button>
    <button class="btn" data-item="glasses"><span class="icon">🕶️</span>Kính</button>
    <button class="btn" data-item="cape"><span class="icon">🦸</span>Choàng</button>
    <button class="btn" data-item="sword"><span class="icon">🗡️</span>Kiếm</button>
    <button class="btn" data-item="hat"><span class="icon">🎉</span>Mũ</button>
  </div>

<script>
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ids = btn.dataset.item.split(',');
      const isActive = btn.classList.contains('active');
      ids.forEach(id => {
        document.getElementById(id).classList.toggle('hidden', isActive);
      });
      btn.classList.toggle('active', !isActive);
    });
  });
</script>
</body>
</html>
