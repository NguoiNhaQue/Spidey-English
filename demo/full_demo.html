<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Tủ đồ - Full trang bị (v3)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#87ceeb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h2{color:#1c2b4a;margin:8px 0 12px;text-align:center}
  .stage{position:relative;width:min(92vw,380px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;
    background:url('https://spidey-english-88.vercel.app/assets/bedroom_bg.jpg') center/cover;
    box-shadow:0 12px 32px rgba(0,0,0,.25);border:4px solid #fff}
  .spidey{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .spidey img{height:92%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
  .item{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
  .btn{padding:10px 14px;border-radius:999px;border:2px solid #bcd6f5;background:#fff;font-weight:700;
    cursor:pointer;font-size:13px}
  .btn.on{background:#ffd93b;border-color:#e09b00}
  .note{margin-top:12px;color:#3a4a6a;font-size:13px;text-align:center;max-width:400px;line-height:1.5}
</style>
</head>
<body>
<h2>🕷️ Demo Tủ đồ — Full trang bị v3</h2>
<div class="stage" id="stage">
  <div class="spidey"><img src="https://spidey-english-88.vercel.app/assets/a06_final.png" alt="Spidey"></div>
</div>
<div class="controls" id="controls"></div>
<p class="note">V3: giày 2 chân riêng, áo choàng sau lưng, kính đúng mắt. Bấm nút bật/tắt.</p>
<script>
const B='https://spidey-english-88.vercel.app/assets/';
const ITEMS=[
  // LEFT shoe on left foot, RIGHT shoe on right foot (using pair image, cropped via object-position would be complex, so use two smaller copies)
  {id:'shoeL', name:'👟 Giày T', img:B+'item_shoes_t.png', l:33, t:84, w:16, z:3},
  {id:'shoeR', name:'👟 Giày P', img:B+'item_shoes_t.png', l:67, t:84, w:16, z:3},
  // Sword in raised right hand (top-left)
  {id:'sword', name:'🗡️ Kiếm', img:B+'item_sword_t.png', l:27, t:10, w:22, z:4, rot:-20},
  {id:'sword2', name:'⚔️ Kiếm AS', img:B+'item_sword2_t.png', l:27, t:10, w:22, z:4, rot:-20},
  // Glasses on eyes (face at top-center)
  {id:'mask', name:'🕶️ Kính', img:B+'item_mask_t.png', l:50, t:20, w:22, z:4},
  // Cape BEHIND Spidey (z-index 1, below spidey z-index 2)
  {id:'cape', name:'🦸 Choàng', img:B+'item_cape_t.png', l:50, t:42, w:55, z:1},
  {id:'cape2', name:'✨ Choàng PS', img:B+'item_cape2_t.png', l:50, t:42, w:55, z:1},
  // Gloves on hands
  {id:'gloveR', name:'🧤 Găng P', img:B+'item_gloves_t.png', l:27, t:8, w:12, z:4},
  {id:'gloveL', name:'🧤 Găng T', img:B+'item_gloves_t.png', l:68, t:38, w:12, z:4},
  // Rocket shoes (tier 2) - replace normal shoes
  {id:'shoeL2', name:'🚀 Giày PL T', img:B+'item_shoes2_t.png', l:33, t:84, w:16, z:3},
  {id:'shoeR2', name:'🚀 Giày PL P', img:B+'item_shoes2_t.png', l:67, t:84, w:16, z:3},
  // Hat on head
];
const stage=document.getElementById('stage');
const controls=document.getElementById('controls');
// Default: tier 1 full set ON, tier 2 OFF
const active={shoeL:true,shoeR:true,sword:true,mask:true,cape:true,gloveR:true,gloveL:true,
  sword2:false,cape2:false,shoeL2:false,shoeR2:false};
function render(){
  stage.querySelectorAll('.item').forEach(e=>e.remove());
  ITEMS.forEach(it=>{
    if(!active[it.id])return;
    const im=document.createElement('img');
    im.className='item'; im.src=it.img;
    let css=`left:${it.l}%;top:${it.t}%;width:${it.w}%;z-index:${it.z};`;
    if(it.rot)css+=`transform:translate(-50%,-50%) rotate(${it.rot}deg);`;
    im.style.cssText=css;
    stage.appendChild(im);
  });
  controls.innerHTML='';
  ITEMS.forEach(it=>{
    const b=document.createElement('button');
    b.className='btn'+(active[it.id]?' on':'');
    b.textContent=it.name;
    b.onclick=()=>{active[it.id]=!active[it.id];render();};
    controls.appendChild(b);
  });
}
render();
</script>
</body>
</html>
