<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Tủ đồ - Full trang bị</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#87ceeb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h2{color:#1c2b4a;margin:8px 0 12px;text-align:center}
  .stage{position:relative;width:min(92vw,380px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;
    background:url('https://spidey-english-88.vercel.app/assets/bedroom_bg.jpg') center/cover;
    box-shadow:0 12px 32px rgba(0,0,0,.25);border:4px solid #fff}
  .spidey{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
  .spidey img{height:96%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
  .item{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px}
  .btn{padding:10px 16px;border-radius:999px;border:2px solid #bcd6f5;background:#fff;font-weight:700;
    cursor:pointer;font-size:14px}
  .btn.on{background:#ffd93b;border-color:#e09b00}
  .note{margin-top:12px;color:#3a4a6a;font-size:13px;text-align:center;max-width:400px;line-height:1.5}
</style>
</head>
<body>
<h2>🕷️ Demo Tủ đồ — Full trang bị</h2>
<div class="stage" id="stage">
  <div class="spidey"><img src="https://spidey-english-88.vercel.app/assets/a06_final.png" alt="Spidey"></div>
</div>
<div class="controls" id="controls"></div>
<p class="note">Bấm các nút để bật/tắt từng vật phẩm. Chụp màn hình gửi mình nếu vị trí nào bị lệch.</p>
<script>
const ITEMS = [
  {id:'shoes', name:'👟 Giày', img:'https://spidey-english-88.vercel.app/assets/a40.webp', l:26, t:88, w:22, z:3},
  {id:'shoes2', name:'🚀 Giày phản lực', img:'https://spidey-english-88.vercel.app/assets/item_shoes2.png', l:26, t:88, w:22, z:3},
  {id:'gloves', name:'🧤 Găng tay', img:'https://spidey-english-88.vercel.app/assets/a43.webp', l:50, t:55, w:30, z:3},
  {id:'mask', name:'🕶️ Kính', img:'https://spidey-english-88.vercel.app/assets/a42.webp', l:50, t:28, w:36, z:4},
  {id:'cape', name:'🦸 Áo choàng', img:'https://spidey-english-88.vercel.app/assets/a41.webp', l:50, t:60, w:90, z:1},
  {id:'cape2', name:'✨ Choàng phát sáng', img:'https://spidey-english-88.vercel.app/assets/item_cape2.png', l:50, t:60, w:90, z:1},
  {id:'sword', name:'🗡️ Kiếm', img:'https://spidey-english-88.vercel.app/assets/item_sword.png', l:24, t:16, w:34, z:4, rot:-30},
  {id:'sword2', name:'⚔️ Kiếm ánh sáng', img:'https://spidey-english-88.vercel.app/assets/item_sword2.png', l:24, t:16, w:34, z:4, rot:-30},
  {id:'hat', name:'🎩 Mũ', img:'https://spidey-english-88.vercel.app/assets/a40.webp', l:50, t:8, w:40, z:5},
];
const stage = document.getElementById('stage');
const controls = document.getElementById('controls');
const active = {};
// Start with ALL equipped (full trang bị)
ITEMS.forEach(it => active[it.id] = true);
function render(){
  stage.querySelectorAll('.item').forEach(e=>e.remove());
  ITEMS.forEach(it=>{
    if(!active[it.id]) return;
    const im = document.createElement('img');
    im.className='item'; im.src=it.img;
    let css=`left:${it.l}%;top:${it.t}%;width:${it.w}%;z-index:${it.z};`;
    if(it.rot) css+=`transform:translate(-50%,-50%) rotate(${it.rot}deg);`;
    im.style.cssText=css;
    stage.appendChild(im);
  });
  controls.innerHTML='';
  ITEMS.forEach(it=>{
    const b=document.createElement('button');
    b.className='btn'+(active[it.id]?' on':'');
    b.textContent=it.name;
    b.onclick=()=>{active[it.id]=!active[it.id];render();};
    controls.appendChild(b);
  });
}
render();
</script>
</body>
</html>
